<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChatChat & 心情宇宙</title>
    <meta name="description" content="免註冊的文字聊天室與心情宇宙：建立房間即時對話，或化作星點分享心事。">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='11' fill='%235b7fe5'/%3E%3Cellipse cx='11' cy='16' rx='3.5' ry='3' fill='%23fffdf7'/%3E%3Cellipse cx='21' cy='16' rx='3.5' ry='3' fill='%23fffdf7'/%3E%3C/svg%3E">

    <!--
      主題必須在樣式套用前決定，否則會閃一下錯的顏色。所以這段小程式碼放在
      head 最前面，它只讀 localStorage 與系統偏好，不做其他事。
    -->
    <script>
        (function () {
            try {
                var saved = window.localStorage.getItem("chatchat-theme") || "system";
                var dark = saved === "dark" ||
                    (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.dataset.theme = dark ? "dark" : "light";
                document.documentElement.dataset.themePreference = saved;
            } catch (error) {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>

    <!-- 像素字體：Fusion Pixel Font（TakWolf，SIL OFL 1.1）的 webfont 分包 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@vp-tw/cjk-web-fonts-fusion-pixel-font@0.0.1/dist/12px/proportional/latin/Fusion-Pixel-12px-Proportional-Latin.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@vp-tw/cjk-web-fonts-fusion-pixel-font@0.0.1/dist/12px/proportional/zh_hant/Fusion-Pixel-12px-Proportional-Traditional-Chinese.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@vp-tw/cjk-web-fonts-fusion-pixel-font@0.0.1/dist/12px/proportional/zh_hans/Fusion-Pixel-12px-Proportional-Simplified-Chinese.css">

    <!-- Tailwind 已預先編譯成本機檔案（重建指令見 README），不再從 CDN 載入遠端程式碼 -->
    <link rel="stylesheet" href="./assets/css/tailwind.css">
    <link rel="stylesheet" href="./assets/css/app.css">
</head>

<body id="main-body" class="paper-texture" data-screen="landing-screen">


    <!-- 心情宇宙以外的畫面才有這顆按鈕；聊天室裡面的那顆在側邊欄 -->
    <button type="button" id="btn-theme" class="btn btn--sm theme-toggle" aria-label="切換佈景主題">
        <span aria-hidden="true">☾</span><span id="theme-label">跟隨系統</span>
    </button>

    <!-- ==================== 1. 入口大廳 ==================== -->
    <section id="landing-screen" class="screen screen--landing">
        <div class="card card--raised modal-enter w-full max-w-3xl p-6 md:p-10">
            <div class="hero mb-8">
                <img id="hero-avatar" class="hero-avatar" alt="" width="96" height="96">
                <h1 class="title">專屬空間</h1>
                <p class="label">ChatChat &amp; 心情宇宙</p>
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <button type="button" class="choice-card flex-1" data-goto="setup-screen">
                    <span class="choice-icon" aria-hidden="true">💬</span>
                    <span class="choice-name">ChatChat</span>
                    <span class="choice-desc">建立房間、即時文字對話。訊息會留下來，新加入的人也看得到。</span>
                </button>
                <button type="button" class="choice-card flex-1" id="btn-enter-universe">
                    <span class="choice-icon" aria-hidden="true">🌌</span>
                    <span class="choice-name">心情宇宙</span>
                    <span class="choice-desc">把今天的心情化成星點，讓別人給你一點回應。</span>
                </button>
            </div>

            <p class="note mt-8">
                <span aria-hidden="true">⚠️</span>
                <span>訊息沒有加密，任何知道網址的人都能讀寫。請勿傳送機密內容。</span>
            </p>
        </div>
    </section>

    <!-- ==================== 2. 建立／加入房間 ==================== -->
    <section id="setup-screen" class="screen screen--setup is-hidden">
        <div class="card card--raised modal-enter w-full max-w-md p-6 relative">
            <div class="flex items-center justify-between mb-6">
                <button type="button" class="btn btn--sm btn--muted" data-goto="landing-screen">← 返回</button>
                <h2 class="label">ChatChat</h2>
            </div>

            <div class="flex flex-col gap-5">
                <div>
                    <label class="field" for="room-id">房間號碼</label>
                    <div class="flex gap-2 items-stretch">
                        <input type="text" id="room-id" class="input" autocomplete="off" spellcheck="false"
                            maxlength="32" placeholder="例如 y3514myuy1-ux">
                        <button type="button" id="btn-random-room" class="btn btn--muted btn--icon shrink-0"
                            title="產生猜不到的隨機房號" aria-label="產生隨機房號">🎲</button>
                    </div>
                    <span class="hint">建議用 🎲 產生隨機房號。</span>
                </div>

                <div class="flex items-center gap-4">
                    <div class="min-w-0 flex-1">
                        <label class="field" for="nickname">暱稱</label>
                        <input type="text" id="nickname" class="input" maxlength="10" placeholder="最多 10 字">
                        <span class="hint">沒有上傳頭像時，這個名字會決定你的頭像。</span>
                    </div>
                    <img id="avatar-preview" class="avatar-tile avatar-tile--xl" alt="頭像預覽" width="88"
                        height="88">
                </div>

                <div>
                    <label class="field" for="avatar-input">自訂頭像（可選）</label>
                    <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp,image/gif"
                        class="file-input">
                    <div class="flex items-start justify-between gap-2 mt-1">
                        <span class="hint">上傳的圖會自動壓縮並記在這台裝置上；不上傳就用名字產生。</span>
                        <button type="button" id="btn-clear-avatar"
                            class="btn btn--sm btn--muted shrink-0 is-hidden">用名字產生</button>
                    </div>
                </div>

                <p class="note">
                    <span aria-hidden="true">🔓</span>
                    <span>房間只有房號：猜到的人就能進來，請把它當成邀請函。</span>
                </p>

                <div class="flex gap-3">
                    <button type="button" id="btn-create" class="btn btn--primary flex-1">建立房間</button>
                    <button type="button" id="btn-join" class="btn btn--ok flex-1">加入房間</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== 3. 對話畫面 ==================== -->
    <section id="chat-screen" class="screen screen--chat is-hidden">
        <div class="chat-shell modal-enter">
            <aside class="sidebar">
                <div class="sidebar-head">
                    <h2 class="label">房號 <span id="display-room-id" class="accent"></span></h2>
                    <div class="flex items-center gap-1 shrink-0">
                        <button type="button" id="btn-theme-inline" class="btn btn--sm btn--muted"
                            aria-label="切換佈景主題"><span aria-hidden="true">☾</span></button>
                        <button type="button" id="btn-menu" class="btn btn--sm btn--muted menu-toggle"
                            aria-expanded="false" aria-controls="mobile-sidebar-content">成員</button>
                        <button type="button" id="btn-leave" class="btn btn--sm">退出</button>
                    </div>
                </div>

                <div id="mobile-sidebar-content" class="sidebar-panel is-hidden">
                    <div class="p-3 hairline-b">
                        <button type="button" id="btn-pick-bg" class="btn btn--muted w-full">🖼️ 更換背景</button>
                        <input type="file" id="bg-input" accept="image/png,image/jpeg,image/webp,image/gif"
                            class="is-hidden">
                    </div>

                    <p class="label px-3 py-2 hairline-y">成員</p>
                    <div class="members no-scrollbar" id="members-list" role="list"></div>

                    <div class="sidebar-foot">
                        <button type="button" id="btn-leave-panel" class="btn btn--muted w-full">退出房間</button>
                        <button type="button" id="btn-disband"
                            class="btn btn--danger w-full is-hidden">解散房間</button>
                    </div>
                </div>
            </aside>

            <div class="chat-main">
                <div class="chat-log no-scrollbar" id="chat-messages" role="log" aria-live="polite" aria-label="訊息串">
                </div>

                <div id="reply-preview" class="reply-preview is-hidden">
                    <span>回覆 <strong id="reply-to-name"></strong></span>
                    <button type="button" id="btn-cancel-reply" class="btn btn--sm btn--muted"
                        aria-label="取消回覆">✕</button>
                </div>

                <div class="composer">
                    <button type="button" id="btn-pick-image" class="btn btn--muted btn--icon"
                        aria-label="傳送圖片">📷</button>
                    <input type="file" id="chat-img-input" accept="image/png,image/jpeg,image/webp,image/gif"
                        class="is-hidden">
                    <label class="sr-only" for="message-input">訊息內容</label>
                    <textarea id="message-input" rows="1" class="input input--grow flex-1 no-scrollbar"
                        placeholder="輸入訊息…" maxlength="2000"></textarea>
                    <button type="button" id="btn-send" class="btn btn--primary shrink-0">送出</button>
                </div>
                <p id="composer-notice" class="hint px-3 pb-2 is-hidden" role="status"></p>
            </div>

            <div id="star-menu" class="star-menu is-hidden is-closed" role="menu">
                <button type="button" class="btn btn--sm" data-react="👍" role="menuitem" aria-label="按讚">👍</button>
                <button type="button" class="btn btn--sm" data-react="❤️" role="menuitem" aria-label="愛心">❤️</button>
                <button type="button" id="btn-reply" class="btn btn--sm btn--primary" role="menuitem">回覆</button>
            </div>
        </div>
    </section>

    <!-- ==================== 4. 心情宇宙 ==================== -->
    <section id="universe-screen" class="screen screen--universe is-hidden">
        <button type="button" id="btn-exit-universe" class="btn btn--night btn--sm universe-exit">← 離開宇宙</button>

        <div class="legend" id="legend">
            <button type="button" id="btn-legend" class="legend-toggle" aria-expanded="false"
                aria-controls="legend-body">
                <span>宇宙導覽</span>
                <span class="legend-caret" aria-hidden="true">▾</span>
            </button>
            <div class="legend-body" id="legend-body">
                <div class="legend-grid">
                    <button type="button" class="legend-mood" data-emotion="happy">
                        <span class="legend-dot" data-mood="happy"></span>開心
                        <span class="legend-count" data-count-for="happy"></span>
                    </button>
                    <button type="button" class="legend-mood" data-emotion="bored">
                        <span class="legend-dot" data-mood="bored"></span>無聊
                        <span class="legend-count" data-count-for="bored"></span>
                    </button>
                    <button type="button" class="legend-mood" data-emotion="angry">
                        <span class="legend-dot" data-mood="angry"></span>憤怒
                        <span class="legend-count" data-count-for="angry"></span>
                    </button>
                    <button type="button" class="legend-mood" data-emotion="crush">
                        <span class="legend-dot" data-mood="crush"></span>心動
                        <span class="legend-count" data-count-for="crush"></span>
                    </button>
                    <button type="button" class="legend-mood" data-emotion="sad">
                        <span class="legend-dot" data-mood="sad"></span>難過
                        <span class="legend-count" data-count-for="sad"></span>
                    </button>
                    <button type="button" class="legend-mood" data-emotion="other">
                        <span class="legend-dot" data-mood="other"></span>其他
                        <span class="legend-count" data-count-for="other"></span>
                    </button>
                </div>
                <p class="legend-foot">※ 點心情看清單；橘色微光＝別人的迴響</p>
            </div>
        </div>

        <div id="planets-container" class="relative w-full h-full"></div>
        <div id="stars-container" class="absolute inset-0"></div>
    </section>

    <!-- 宇宙：發文 -->
    <div id="universe-post-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="u-post-title">
        <div class="card--night modal-panel modal-enter">
            <div class="modal-head">
                <h2 id="u-post-title" class="title--sm">留下心事</h2>
                <button type="button" class="btn btn--night btn--sm" data-close-universe aria-label="關閉">✕</button>
            </div>
            <div class="modal-body">
                <div>
                    <label class="label--night block mb-2" for="u-post-text">心事內容</label>
                    <textarea id="u-post-text" rows="5" class="input input--night" maxlength="1000"
                        placeholder="今天發生了什麼事呢？"></textarea>
                </div>

                <div>
                    <label class="label--night block mb-2" for="u-post-nickname">你的暱稱（選填）</label>
                    <input type="text" id="u-post-nickname" class="input input--night" maxlength="10"
                        placeholder="匿名旅人">
                </div>

                <p class="note note--night">
                    <span aria-hidden="true">👁️</span>
                    <span>心事會公開給所有開啟這個網站的人閱讀，寫下前請留意。</span>
                </p>

                <button type="button" id="btn-u-submit" class="btn btn--primary w-full">化為星點發送</button>
            </div>
        </div>
    </div>

    <!-- 宇宙：某個心情的心事清單 -->
    <div id="universe-list-modal" class="modal is-hidden" role="dialog" aria-modal="true"
        aria-labelledby="u-list-title">
        <div class="card--night modal-panel modal-enter">
            <div class="modal-head">
                <h2 id="u-list-title" class="title--sm">心事清單</h2>
                <button type="button" class="btn btn--night btn--sm" data-close-universe aria-label="關閉">✕</button>
            </div>
            <div class="modal-body no-scrollbar">
                <div id="u-list-items" class="flex flex-col gap-3"></div>
            </div>
        </div>
    </div>

    <!-- 宇宙：閱讀與回覆 -->
    <div id="universe-read-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="u-read-name">
        <div class="card--night modal-panel modal-enter">
            <div class="modal-head">
                <div class="flex items-center gap-3 min-w-0">
                    <img id="u-read-avatar" class="avatar-tile avatar-tile--lg avatar-tile--night" alt="" width="40"
                        height="40">
                    <div class="min-w-0">
                        <div id="u-read-name" class="truncate"></div>
                        <div id="u-read-time" class="label--night"></div>
                    </div>
                </div>
                <button type="button" class="btn btn--night btn--sm" data-close-universe aria-label="關閉">✕</button>
            </div>

            <div class="modal-body no-scrollbar">
                <p id="u-read-text" class="bubble bubble--night"></p>

                <p class="label--night text-center">宇宙迴響</p>
                <div id="u-replies-list" class="flex flex-col gap-3"></div>
            </div>

            <div class="universe-composer">
                <label class="sr-only" for="u-reply-input">迴響內容</label>
                <textarea id="u-reply-input" rows="1" class="input input--night input--grow flex-1 no-scrollbar" maxlength="500"
                    placeholder="給予回應…"></textarea>
                <button type="button" id="btn-u-reply" class="btn btn--warn shrink-0">回覆</button>
            </div>
        </div>
    </div>

    <script type="module" src="./assets/js/app.js"></script>
</body>

</html>
