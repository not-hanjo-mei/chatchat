<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨時聊天室 - 升級版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 機密模式樣式 */
        .secure-mode {
            user-select: none;
            -webkit-user-select: none;
        }
        .watermark {
            pointer-events: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" opacity="0.05" transform="rotate(-45)"><text x="10" y="100" font-size="20" fill="black" font-family="sans-serif">機密內容 - 禁止外流</text></svg>');
            z-index: 9999;
            display: none;
        }
        .secure-mode .watermark { display: block; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans text-gray-800 bg-cover bg-center" id="main-body">

    <!-- 浮水印層 -->
    <div class="watermark" id="watermark-layer"></div>

    <!-- 登入/建立房間畫面 -->
    <div id="setup-screen" class="bg-white/95 backdrop-blur p-8 rounded-xl shadow-lg w-full max-w-md mx-4">
        <h1 class="text-2xl font-bold mb-6 text-center text-indigo-600">加入或建立聊天室</h1>
        <div class="space-y-4">
            <div><label class="block text-sm font-medium mb-1">房間號碼</label><input type="text" id="room-id" placeholder="輸入房間號碼" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"></div>
            <div><label class="block text-sm font-medium mb-1">暱稱 (最多10字)</label><input type="text" id="nickname" maxlength="10" placeholder="你的暱稱" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"></div>
            <div><label class="block text-sm font-medium mb-1">自訂頭像 (可選)</label><input type="file" id="avatar-input" accept="image/*" class="w-full text-sm text-gray-500 border rounded-lg p-1">
                <img id="avatar-preview" class="mt-2 w-16 h-16 rounded-full object-cover hidden border" /></div>
            <div class="flex space-x-3 pt-4">
                <button id="btn-create" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">建立房間</button>
                <button id="btn-join" class="flex-1 bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition">加入房間</button>
            </div>
        </div>
    </div>

    <!-- 聊天室畫面 -->
    <div id="chat-screen" class="hidden w-full h-full max-w-6xl bg-white/95 backdrop-blur shadow-xl flex flex-col md:flex-row md:h-[90vh] md:rounded-2xl overflow-hidden relative">
        
        <!-- 側邊欄 -->
        <div class="w-full md:w-64 bg-gray-50/90 border-r flex flex-col">
            <div class="p-4 border-b bg-indigo-50 flex flex-col space-y-2">
                <h2 class="font-bold text-indigo-800">房間: <span id="display-room-id"></span></h2>
                <div class="flex items-center space-x-2 text-sm">
                    <button class="bg-gray-200 px-2 py-1 rounded hover:bg-gray-300" onclick="document.getElementById('bg-input').click()">🖼️ 換背景</button>
                    <input type="file" id="bg-input" accept="image/*" class="hidden">
                </div>
                <!-- 房主專屬：機密模式開關 -->
                <div id="host-controls" class="hidden mt-2 pt-2 border-t border-indigo-200">
                    <label class="flex items-center space-x-2 text-sm font-semibold text-red-600 cursor-pointer">
                        <input type="checkbox" id="secure-toggle" class="form-checkbox text-red-600">
                        <span>🛡️ 開啟防截圖機密模式</span>
                    </label>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar" id="members-list"></div>
            <div class="p-4 border-t space-y-2">
                <button id="btn-leave" class="w-full bg-gray-200 py-2 rounded-lg hover:bg-gray-300">退出房間</button>
                <button id="btn-disband" class="hidden w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600">解散房間</button>
            </div>
        </div>

        <!-- 聊天主區域 -->
        <div class="flex-1 flex flex-col h-[60vh] md:h-full relative">
            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar bg-gray-100/50" id="chat-messages"></div>
            
            <!-- 回覆預覽區塊 -->
            <div id="reply-preview" class="hidden bg-indigo-50 p-2 border-t text-sm flex justify-between items-center text-indigo-800">
                <span>回覆 <strong id="reply-to-name"></strong>: <span id="reply-to-text" class="truncate max-w-[200px] inline-block align-bottom"></span></span>
                <button onclick="window.cancelReply()" class="text-gray-500 hover:text-red-500 font-bold">✕</button>
            </div>

            <!-- 輸入區 -->
            <div class="p-4 bg-white/90 border-t flex items-center space-x-2">
                <button onclick="document.getElementById('chat-img-input').click()" class="p-2 text-gray-500 hover:text-indigo-600 bg-gray-100 rounded-full">📷</button>
                <input type="file" id="chat-img-input" accept="image/*" class="hidden">
                <input type="text" id="message-input" placeholder="輸入訊息... (輸入 @ 可標記人)" class="flex-1 border rounded-full px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                <button id="btn-send" class="bg-indigo-600 text-white px-6 py-2 rounded-full hover:bg-indigo-700">發送</button>
            </div>
        </div>

        <!-- 星星選單 (隱藏彈出) -->
        <div id="star-menu" class="hidden absolute bg-white shadow-xl border rounded-lg p-2 flex space-x-2 z-50">
            <button class="hover:bg-gray-100 p-1 rounded text-xl" onclick="window.addReaction('👍')">👍</button>
            <button class="hover:bg-gray-100 p-1 rounded text-xl" onclick="window.addReaction('❤️')">❤️</button>
            <button class="hover:bg-gray-100 p-1 rounded text-xl" onclick="window.addReaction('😂')">😂</button>
            <button class="hover:bg-gray-100 p-1 rounded text-xl" onclick="window.addReaction('😮')">😮</button>
            <div class="w-px bg-gray-300 mx-1"></div>
            <button class="hover:bg-gray-100 p-1 px-3 rounded text-sm font-bold text-indigo-600" onclick="window.triggerReply()">回覆</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, onChildAdded, onChildChanged, onDisconnect, remove, get, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAR8ij9OjrePtf6heoMghCcp7JVu_L5z6U",
            authDomain: "chat-f46da.firebaseapp.com",
            databaseURL: "https://chat-f46da-default-rtdb.firebaseio.com",
            projectId: "chat-f46da",
            storageBucket: "chat-f46da.firebasestorage.app",
            messagingSenderId: "148711107012",
            appId: "1:148711107012:web:676fdcea4bcb62f1225c91"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
        let myNickname = '';
        let myAvatarBase64 = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + myUserId;
        let currentRoomId = null;
        let isHost = false;
        
        // 新功能狀態
        let replyingTo = null; // { id, name, text }
        let currentSelectedMsgId = null; // 給星星選單用的

        // DOM
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const starMenu = document.getElementById('star-menu');

        // ====== 1. 圖片處理 (壓縮與轉 Base64) ======
        function processImage(file, callback) {
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) return alert('圖片請小於 2MB'); // 避免資料庫撐爆
            const reader = new FileReader();
            reader.onload = (e) => callback(e.target.result);
            reader.readAsDataURL(file);
        }

        document.getElementById('avatar-input').addEventListener('change', (e) => {
            processImage(e.target.files[0], (base64) => {
                myAvatarBase64 = base64;
                document.getElementById('avatar-preview').src = base64;
                document.getElementById('avatar-preview').classList.remove('hidden');
            });
        });

        // ====== 2. 更改個人背景 ======
        document.getElementById('bg-input').addEventListener('change', (e) => {
            processImage(e.target.files[0], (base64) => {
                document.getElementById('main-body').style.backgroundImage = `url(${base64})`;
            });
        });

        // ====== 3. 進入房間邏輯 ======
        document.getElementById('btn-create').addEventListener('click', () => initRoom(true));
        document.getElementById('btn-join').addEventListener('click', () => initRoom(false));

        async function initRoom(isCreate) {
            const roomId = document.getElementById('room-id').value.trim();
            myNickname = document.getElementById('nickname').value.trim() || '匿名';
            if (!roomId) return alert("請輸入房間號碼");

            const snap = await get(ref(db, `rooms/${roomId}`));
            if (isCreate && snap.exists()) return alert("房間已存在");
            if (!isCreate && !snap.exists()) return alert("房間不存在");

            currentRoomId = roomId;
            if (isCreate) await set(ref(db, `rooms/${roomId}/host`), myUserId);

            const myRef = ref(db, `rooms/${roomId}/members/${myUserId}`);
            await set(myRef, { name: myNickname, avatar: myAvatarBase64, joinedAt: Date.now() });
            onDisconnect(myRef).remove();

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('display-room-id').innerText = roomId;

            setupListeners();
        }

        // ====== 4. 監聽器與防外流模式 ======
        function setupListeners() {
            // 監聽房間設定 (防截圖)
            onValue(ref(db, `rooms/${currentRoomId}/settings/secureMode`), (snap) => {
                const isSecure = snap.val() || false;
                document.body.classList.toggle('secure-mode', isSecure);
                if (isHost) document.getElementById('secure-toggle').checked = isSecure;
            });

            // 房主切換防截圖
            document.getElementById('secure-toggle').addEventListener('change', (e) => {
                update(ref(db, `rooms/${currentRoomId}/settings`), { secureMode: e.target.checked });
            });

            // 監聽成員與房主
            onValue(ref(db, `rooms/${currentRoomId}/members`), async (snap) => {
                const members = snap.val();
                if (!members) return; 
                if (!members[myUserId]) { alert("你已離開房間"); return window.location.reload(); }

                const hostSnap = await get(ref(db, `rooms/${currentRoomId}/host`));
                isHost = (hostSnap.val() === myUserId);
                
                document.getElementById('btn-disband').classList.toggle('hidden', !isHost);
                document.getElementById('host-controls').classList.toggle('hidden', !isHost);
                renderMembers(members, hostSnap.val());
            });

            // 監聽訊息新增
            onChildAdded(ref(db, `rooms/${currentRoomId}/messages`), (snap) => renderMessage(snap.key, snap.val()));
            
            // 監聽訊息變更 (例如別人按了表情符號)
            onChildChanged(ref(db, `rooms/${currentRoomId}/messages`), (snap) => updateMessageReactions(snap.key, snap.val()));
        }

        // ====== 5. 渲染訊息與 @提及功能 ======
        function renderMessage(msgId, msg) {
            const isMe = msg.sender === myUserId;
            // 判斷是否有人 @ 我
            const isMentioningMe = msg.text && msg.text.includes('@' + myNickname);
            
            // 處理文字內的 @ 標記顏色
            let formattedText = msg.text ? msg.text.replace(/@(\S+)/g, '<span class="text-blue-600 font-bold bg-blue-100 px-1 rounded">@$1</span>') : '';

            const msgDiv = document.createElement('div');
            msgDiv.id = `msg-${msgId}`;
            msgDiv.className = `flex items-end space-x-2 relative group ${isMe ? 'justify-end' : ''}`;
            
            let html = '';
            if (!isMe) html += `<img src="${msg.avatar}" class="w-8 h-8 rounded-full border object-cover">`;
            
            html += `<div class="max-w-[75%] relative">`;
            if (!isMe) html += `<p class="text-xs text-gray-500 mb-1 ml-1">${msg.name}</p>`;
            
            // 如果有回覆，顯示引用區塊
            if (msg.replyTo) {
                html += `<div class="bg-black/5 text-xs p-1.5 rounded-t-xl border-l-4 border-indigo-400 mb-[-5px] pb-2 text-gray-600 truncate">
                            回覆 ${msg.replyTo.name}:${msg.replyTo.text || '圖片'}
                         </div>`;
            }

            // 訊息主體 (如果被 @，背景變色)
            const bubbleBg = isMe ? 'bg-indigo-600 text-white' : (isMentioningMe ? 'bg-yellow-100 text-gray-800 ring-2 ring-yellow-400' : 'bg-white text-gray-800');
            html += `<div class="px-4 py-2 rounded-2xl shadow-sm break-words relative z-10 ${bubbleBg}${isMe?'rounded-br-none':'rounded-bl-none'}">`;
            
            if (msg.image) html += `<img src="${msg.image}" class="max-w-full rounded-lg mb-1 cursor-pointer" onclick="window.open('${msg.image}')">`;
            if (formattedText) html += `<span>${formattedText}</span>`;
            
            html += `</div>`;

            // 表情符號顯示區
            html += `<div id="reactions-${msgId}" class="flex flex-wrap gap-1 mt-1 z-20 relative"></div>`;
            html += `</div>`;

            // 星星按鈕 (Hover 時顯示)
            const starBtn = `<button class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-yellow-500 transition px-2 pb-4 text-xl" onclick="window.showStarMenu(event, '${msgId}', '${msg.name}', \`${msg.text ? msg.text.replace(/`/g, "'") : '[圖片]'}\`)">⭐</button>`;
            
            if (isMe) msgDiv.innerHTML = starBtn + html;
            else msgDiv.innerHTML = html + starBtn;

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            updateMessageReactions(msgId, msg); // 初始化表情
        }

        // 更新表情符號
        function updateMessageReactions(msgId, msg) {
            const container = document.getElementById(`reactions-${msgId}`);
            if (!container) return;
            container.innerHTML = '';
            if (!msg.reactions) return;

            for (const [emoji, users] of Object.entries(msg.reactions)) {
                const count = Object.keys(users).length;
                if (count > 0) {
                    const hasMyReact = users[myUserId];
                    container.innerHTML += `<span class="text-xs bg-white border px-1.5 py-0.5 rounded-full shadow-sm cursor-pointer ${hasMyReact ? 'bg-indigo-50 border-indigo-300' : ''}" onclick="window.addReaction('${emoji}', '${msgId}')">${emoji} ${count}</span>`;
                }
            }
        }

        // ====== 6. 發送訊息 (文字與圖片) ======
        function sendMessage(imgBase64 = null) {
            const text = messageInput.value.trim();
            if (!text && !imgBase64) return;

            const payload = {
                sender: myUserId,
                name: myNickname,
                avatar: myAvatarBase64,
                timestamp: Date.now()
            };
            
            if (text) payload.text = text;
            if (imgBase64) payload.image = imgBase64;
            if (replyingTo) {
                payload.replyTo = replyingTo;
                window.cancelReply(); // 傳送後清空回覆狀態
            }

            push(ref(db, `rooms/${currentRoomId}/messages`), payload);
            messageInput.value = '';
        }

        document.getElementById('btn-send').addEventListener('click', () => sendMessage());
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        // 傳送圖片
        document.getElementById('chat-img-input').addEventListener('change', (e) => {
            processImage(e.target.files[0], (base64) => {
                sendMessage(base64);
                e.target.value = ''; // 重置 input
            });
        });

        // ====== 7. 星星選單、回覆與表情互動 ======
        window.showStarMenu = (event, msgId, name, text) => {
            currentSelectedMsgId = msgId;
            replyingTo = { id: msgId, name: name, text: text }; // 暫存回覆對象
            
            // 計算選單位置
            const rect = event.target.getBoundingClientRect();
            starMenu.style.left = `${rect.left}px`;
            starMenu.style.top = `${rect.top - 40}px`;
            starMenu.classList.remove('hidden');
            
            // 點擊其他地方關閉選單
            setTimeout(() => {
                document.addEventListener('click', function closeMenu() {
                    starMenu.classList.add('hidden');
                    document.removeEventListener('click', closeMenu);
                });
            }, 10);
        };

        window.triggerReply = () => {
            // 顯示回覆預覽 UI
            document.getElementById('reply-preview').classList.remove('hidden');
            document.getElementById('reply-to-name').innerText = replyingTo.name;
            document.getElementById('reply-to-text').innerText = replyingTo.text;
            messageInput.focus();
        };

        window.cancelReply = () => {
            replyingTo = null;
            document.getElementById('reply-preview').classList.add('hidden');
        };

        window.addReaction = async (emoji, forceMsgId = null) => {
            const targetId = forceMsgId || currentSelectedMsgId;
            if (!targetId) return;

            const reactRef = ref(db, `rooms/${currentRoomId}/messages/${targetId}/reactions/${emoji}/${myUserId}`);
            const snap = await get(reactRef);
            
            // 如果已經按過就取消，沒按過就新增 (Toggle)
            if (snap.exists()) {
                await remove(reactRef);
            } else {
                await set(reactRef, true);
            }
        };

        // ====== 8. 其他功能與安全攔截 ======
        function renderMembers(members, hostId) {
            const list = document.getElementById('members-list');
            list.innerHTML = '';
            for (let uid in members) {
                const mem = members[uid];
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-white p-2 rounded-lg border">
                        <div class="flex items-center space-x-2">
                            <img src="${mem.avatar}" class="w-8 h-8 rounded-full border object-cover">
                            <div>
                                <p class="text-sm font-medium">${mem.name} ${uid===myUserId ? '(你)' : ''}</p>
                                ${uid===hostId ? '<span class="text-[10px] bg-yellow-100 text-yellow-700 px-1 rounded">房主</span>' : ''}
                            </div>
                        </div>
                        ${(isHost && uid!==myUserId) ? `<button class="text-xs text-red-500 hover:underline" onclick="window.kick('${uid}')">踢出</button>` : ''}
                    </div>`;
            }
        }

        window.kick = async (uid) => { if (confirm("確定踢出？")) await remove(ref(db, `rooms/${currentRoomId}/members/${uid}`)); };
        document.getElementById('btn-disband').onclick = async () => { if(confirm("解散？")) await remove(ref(db, `rooms/${currentRoomId}`)); };
        document.getElementById('btn-leave').onclick = async () => { await remove(ref(db, `rooms/${currentRoomId}/members/${myUserId}`)); window.location.reload(); };

        // --- 防截圖/右鍵攔截邏輯 ---
        document.addEventListener('contextmenu', event => {
            if (document.body.classList.contains('secure-mode')) event.preventDefault();
        });
        
        document.addEventListener('keyup', (e) => {
            if (document.body.classList.contains('secure-mode') && e.key === 'PrintScreen') {
                navigator.clipboard.writeText('此聊天室已開啟機密模式，禁止截圖與外流。');
                alert('⚠️ 房主已開啟機密模式，系統已嘗試攔截截圖操作！');
            }
        });

    </script>
</body>
</html>
